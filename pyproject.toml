[project]
name = "rathindlimb"
version = "0.1.0"
description = "Rat hindlimb musculoskeletal model utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ezc3d",
  "numpy",
  "opensim>=4.6",
  "open3d",
  "osimpy",
  "polars",
  "scipy",
  "tsl-optimization",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
osimpy = { git = "https://github.com/hudsonburke/osimpy.git" }
tsl-optimization = { git = "https://github.com/hudsonburke/tsl-optimization.git" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rathindlimb"]

[tool.setuptools.package-data]
rathindlimb = ["models/**/*.osim", "models/**/*.xml", "models/**/*.stl"]

[tool.pytest.ini_options]
pythonpath = ["rathindlimb"]
testpaths = ["tests"]
